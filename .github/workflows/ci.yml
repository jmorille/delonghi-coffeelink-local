# Intégration continue : le projet n'a pas de suite de tests (les changements de protocole sont
# validés en direct sur la vraie machine), donc la CI vérifie ce qu'elle peut vérifier sans
# cafetière : les types, la syntaxe ET le lint des modules ESM, les quatre vérifications pures, le
# catalogue de messages, le build Next, la base SQLite, et le fait que l'image Docker démarre et
# répond.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Une nouvelle poussée annule la vérification en cours sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # publier l'image `edge` apres un test reussi

jobs:
  verify:
    name: Types, syntaxe et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # La version de pnpm vient du champ `packageManager` de package.json — pnpm 11, d'où le
      # majeur v6 de l'action, le premier à le connaître.
      #
      # ⚠️ Le `node24` que ces actions annoncent N'EST PAS la version de Node qui exécute le
      # projet : c'est le runtime dans lequel GitHub fait tourner l'ACTION elle-même, et il n'en
      # propose que deux — node20, qu'il déprécie, et node24. Il n'existe pas de runtime node26.
      # Notre cible Node 26 est celle de `setup-node` juste en dessous, et c'est elle qui décide
      # sur quoi le build et les vérifications tournent réellement.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérifier les types
        run: node_modules/.bin/tsc --noEmit

      # `server.mjs` et les modules de `src/lib` ne passent pas par TypeScript — `tsconfig.json`
      # n'inclut que les `.ts`/`.tsx` — alors qu'ils constituent le serveur RÉEL ; les copies `.ts`
      # sont shadowées et ne tournent pas. `node --check` attrape la syntaxe, ESLint (étape
      # suivante) le reste. Les deux, parce qu'ils ne voient pas la même chose : `node --check`
      # couvre aussi les fichiers qu'ESLint pourrait ne pas atteindre si sa configuration dérivait.
      - name: Vérifier la syntaxe des modules ESM
        run: |
          for f in server.mjs src/lib/*.mjs; do
            echo "  node --check $f"
            node --check "$f"
          done

      # ESLint 10, configuration plate. Il ne couvre QUE les `.mjs` : voir `eslint.config.mjs`,
      # qui explique pourquoi les `.ts`/`.tsx` sont hors de portée (TypeScript 7 n'expose plus
      # l'API compilateur dont `typescript-eslint` a besoin) et pourquoi ce n'est pas un manque —
      # ce côté-là est déjà couvert par `tsc --noEmit` ci-dessus.
      #
      # Avant cette étape, `pnpm lint` valait `next lint`, une commande supprimée par Next 16 et
      # qui de toute façon n'avait jamais rien vérifié : il n'y a jamais eu d'ESLint dans ce dépôt.
      - name: Linter les modules ESM
        run: pnpm lint

      # Ce que ce dépôt sait prouver SANS la machine. Toutes ces parties sont PURES par
      # construction — l'ordonnanceur prend l'instant en paramètre, le décodeur du monitor prend
      # des octets et rend un objet, le registre d'applications ne fait aucune E/S — d'où des
      # scripts sans dépendance, exécutables ici. Garder cette pureté est ce qui garde ce bloc
      # possible.
      # `verif-monitor` rejoue des trames RÉELLES capturées pendant trois préparations : c'est le
      # seul endroit du projet où du comportement d'appareil est figé et rejouable.
      - name: Vérifier l'ordonnanceur de tâches
        run: node scripts/verif-tasks.mjs

      - name: Vérifier le décodage du monitor
        run: node scripts/verif-monitor.mjs

      # Les deux moitiés du multiplexeur. `verif-lansession` fait dialoguer les rôles « client »
      # et « appareil » d'une même session : se tromper de sens de clés ne lève AUCUNE erreur —
      # on obtient du déchiffrement plausible et illisible — donc c'est la seule façon de le voir.
      - name: Vérifier la session LAN dans les deux rôles
        run: node scripts/verif-lansession.mjs

      - name: Vérifier le registre d'applications
        run: node scripts/verif-apps.mjs

      # Le catalogue de traduction est chargé par next-intl : un JSON invalide, ou un message
      # contenant des chevrons (lus comme des balises de texte enrichi), casse l'interface à
      # l'exécution sans casser le build.
      - name: Vérifier le catalogue de messages
        run: |
          node -e "
            const d = require('./messages/fr.json');
            const bad = [];
            (function walk(o, p) {
              for (const [k, v] of Object.entries(o)) {
                if (typeof v === 'string') { if (/<[^>]/.test(v)) bad.push(p + k); }
                else walk(v, p + k + '.');
              }
            })(d, '');
            if (bad.length) { console.error('messages avec des chevrons :', bad); process.exit(1); }
            console.log('catalogue valide');
          "

      # Une clé de traduction absente ne se voit ni au `tsc` ni au build : tous les traducteurs
      # next-intl ont le même type, et la clé n'est résolue qu'au rendu. La faute sort en
      # MISSING_MESSAGE dans la console du navigateur, donc seulement si quelqu'un ouvre la page ET
      # regarde la console — c'est arrivé.
      - name: Vérifier les clés de traduction
        run: node scripts/verif-messages.mjs

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Vérifie que le stockage SQLite s'initialise et migre correctement, sans machine ni réseau.
      - name: Vérifier le stockage SQLite
        run: |
          # Un ancien fichier de recettes, pour que la migration JSON → SQLite soit exercée.
          mkdir -p /tmp/ci-data
          echo '{"recipes":[{"id":"ci","name":"CI","updatedAt":1}]}' > /tmp/ci-data/recipes.json
          DATA_DIR=/tmp/ci-data node --input-type=module -e "
            const S = await import('./src/lib/store.mjs');
            const info = S.storageInfo();
            if (info.journalMode !== 'wal') throw new Error('journal attendu WAL, obtenu ' + info.journalMode);
            if (info.counts.recipes !== 1) throw new Error('la migration JSON n a pas repris la recette');
            if (info.machines !== 1) throw new Error('une machine attendue sur une base neuve, obtenu ' + info.machines);
            const m1 = S.forMachine(S.DEFAULT_MACHINE);
            m1.putStats([{ id: 3000, value: 42 }]);
            if (m1.allStats()[3000].value !== 42) throw new Error('ecriture de statistique perdue');
            // Isolation : c'est tout l'intérêt de la dimension machine, donc c'est ce qu'il faut vérifier.
            const m2 = S.forMachine(S.createMachine({ label: 'CI' }).id);
            if (m2.countStats() !== 0) throw new Error('la nouvelle machine hérite des donnees de la premiere');
            m2.putStats([{ id: 3000, value: 7 }]);
            if (m1.allStats()[3000].value !== 42) throw new Error('ecriture croisee entre machines');
            // Suppression en cascade : aucune ligne ne doit survivre a sa machine.
            S.deleteMachine(m2.id);
            if (S.storageInfo().counts.stats !== 1) throw new Error('les donnees de la machine supprimee sont restees');
            console.log('stockage OK :', JSON.stringify(info.counts), info.journalMode, 'schéma v' + info.schemaVersion);
          "

      # La migration v1 → v2 est la seule opération capable de détruire les données d'un
      # utilisateur : on la joue sur une base v1 fabriquée ici, plutôt que de la découvrir chez lui.
      - name: Vérifier la migration de schéma v1 vers v2
        run: |
          mkdir -p /tmp/ci-v1
          node --input-type=module -e "
            import { DatabaseSync } from 'node:sqlite';
            const db = new DatabaseSync('/tmp/ci-v1/lan-server.db');
            db.exec('PRAGMA journal_mode = WAL');
            db.exec('CREATE TABLE props (name TEXT PRIMARY KEY, at INTEGER NOT NULL, kind TEXT, data TEXT NOT NULL) STRICT');
            db.exec('CREATE TABLE bean_systems (idx INTEGER PRIMARY KEY, at INTEGER NOT NULL, data TEXT NOT NULL) STRICT');
            db.exec('CREATE TABLE stats (id INTEGER PRIMARY KEY, value INTEGER NOT NULL, at INTEGER NOT NULL) STRICT');
            db.exec('CREATE TABLE recipes (id TEXT PRIMARY KEY, updatedAt INTEGER NOT NULL, data TEXT NOT NULL) STRICT');
            db.exec('CREATE TABLE meta (key TEXT PRIMARY KEY, value TEXT NOT NULL, at INTEGER NOT NULL) STRICT');
            db.exec(\"INSERT INTO props VALUES ('d302_monitor', 1, 'monitor', '{}')\");
            db.exec(\"INSERT INTO stats VALUES (3000, 99, 1)\");
            db.exec(\"INSERT INTO bean_systems VALUES (1, 1, '{}')\");
            db.exec(\"INSERT INTO recipes VALUES ('r1', 1, '{}')\");
            db.exec(\"INSERT INTO meta VALUES ('dsn', '{}', 1)\");
            db.exec('PRAGMA user_version = 1');
            db.close();
            console.log('base v1 fabriquée');
          "
          DATA_DIR=/tmp/ci-v1 node --input-type=module -e "
            const S = await import('./src/lib/store.mjs');
            const info = S.storageInfo();
            if (info.schemaVersion !== 2) throw new Error('schema v2 attendu, obtenu v' + info.schemaVersion);
            if (info.machines !== 1) throw new Error('une machine attendue, obtenu ' + info.machines);
            const st = S.forMachine(S.DEFAULT_MACHINE);
            const c = st.counts();
            if (c.props !== 1 || c.stats !== 1 || c.beanSystems !== 1 || c.recipes !== 1) {
              throw new Error('donnees perdues a la migration : ' + JSON.stringify(c));
            }
            if (st.getMeta('dsn') === null) throw new Error('la table meta n a pas ete reprise');
            if (!S.bootMessages.some((x) => x.includes('v1'))) throw new Error('la migration ne s est pas annoncee');
            console.log('migration v1 → v2 OK :', JSON.stringify(c));
          "
          # Deuxième démarrage : la migration ne doit pas rejouer.
          DATA_DIR=/tmp/ci-v1 node --input-type=module -e "
            const S = await import('./src/lib/store.mjs');
            if (S.bootMessages.length) throw new Error('la migration a rejoue : ' + S.bootMessages.join(' | '));
            console.log('deuxieme demarrage : aucune remigration');
          "

  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      # Construite pour l'architecture du runner seulement : la CI vérifie que l'image se
      # construit et démarre. Le multi-architecture est l'affaire du workflow de release.
      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: delonghi-lan-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Démarrage à vide : aucune cafetière n'est joignable, donc on pointe MACHINE_IP sur une
      # adresse qui refuse tout de suite. Le serveur doit quand même se lever et répondre.
      - name: Démarrer le conteneur et interroger /api/status
        run: |
          docker run -d --name ci-run -p 3000:3000 \
            -e MACHINE_IP=127.0.0.1 \
            -e SERVER_IP=127.0.0.1 \
            delonghi-lan-server:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/status > /tmp/status.json; then
              echo "réponse obtenue après ${i} tentative(s)"
              break
            fi
            sleep 2
          done
          echo "--- /api/status ---"
          cat /tmp/status.json
          node -e "
            const d = require('/tmp/status.json');
            if (typeof d.config?.serverPort !== 'number') throw new Error('charge utile inattendue');
            console.log('le serveur répond, port', d.config.serverPort);
          "
          echo "--- /api/system : le stockage doit annoncer SQLite ---"
          curl -fsS http://127.0.0.1:3000/api/system | node -e "
            const d = JSON.parse(require('node:fs').readFileSync(0, 'utf8'));
            if (d.storage?.engine !== 'sqlite') throw new Error('moteur de stockage inattendu : ' + JSON.stringify(d.storage));
            console.log('stockage', d.storage.engine, d.storage.sqliteVersion, '· journal', d.storage.journalMode);
          "

      - name: Journal du conteneur
        if: always()
        run: docker logs ci-run || true

      - name: Arrêter le conteneur
        if: always()
        run: docker rm -f ci-run || true

      # Publication de `edge` seulement si tout ce qui précède a réussi, et seulement sur la
      # branche principale — jamais depuis une pull request, qui peut venir d'un fork.
      # Sans cette étape, aucune image n'existerait sur GHCR avant la première étiquette `v*`.
      - name: Se connecter à GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image edge
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:edge
          cache-from: type=gha
          cache-to: type=gha,mode=max
